<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Аутентификация и авторизация | Moodle LTI</title>

    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/app.js" defer></script>
  </head>

  <body>
    <div class="course">
      <header class="course-header">
        <div class="author-chip">МШ</div>
        <div class="header-text">
          <p class="tag">LTI 1.3 + Moodle</p>
          <h1 id="title">Тренажёр: аутентификация и авторизация в веб-приложениях</h1>
          <p id="identity" class="muted">Проверяем запуск...</p>
          <p id="context" class="muted"></p>
        </div>
      </header>

      <main>
        <form id="exercise">
          <div id="tasks"></div>

          <div class="controls">
            <button id="new" class="secondary" type="button" hidden>Новая попытка</button>
            <button id="submit" type="submit" disabled>Проверить и отправить в Moodle</button>
          </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section class="history-block">
          <h2>Мои попытки</h2>
          <ol id="history"></ol>
        </section>

        <p class="hint">После отправки вернитесь во вкладку курса и проверьте журнал оценок.</p>
      </main>
    </div>
  </body>
</html>
